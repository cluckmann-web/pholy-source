# Dedicated PHOLY PostgreSQL 16 cluster; never use the shared main cluster.
data_directory = '/var/www/vhosts/pholy.de/pholy-data/postgres'
hba_file = '/var/www/vhosts/pholy.de/pholy-data/config/pg_hba.conf'
ident_file = '/var/www/vhosts/pholy.de/pholy-data/postgres/pg_ident.conf'
listen_addresses = '127.0.0.1'
port = 5448
unix_socket_directories = '/var/www/vhosts/pholy.de/pholy-data/run-postgres'
unix_socket_permissions = 0700
shared_preload_libraries = 'vchord.so'
password_encryption = 'scram-sha-256'
max_connections = 100
shared_buffers = '512MB'
effective_cache_size = '2GB'
work_mem = '16MB'
maintenance_work_mem = '256MB'
wal_compression = on
max_wal_size = '2GB'
min_wal_size = '256MB'
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 2000
timezone = 'Europe/Berlin'
