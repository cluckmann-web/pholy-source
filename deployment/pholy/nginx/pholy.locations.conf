# Template for the PHOLY TLS vhost. Integrate into Plesk's domain config;
# do not blindly append a second location / to a generated vhost.
# Nginx must be able to traverse the runtime directory and read source/*.
location = /source {
    return 301 /source/;
}
location ^~ /source/ {
    alias /var/www/vhosts/pholy.de/pholy-runtime/current/build/www/source/;
    index index.html;
    add_header Cache-Control "no-cache" always;
}
location = /source/source.css {
    alias /var/www/vhosts/pholy.de/pholy-runtime/current/build/www/source/source.css;
    default_type text/css;
}
location = /source/pholy-source.tar.gz {
    alias /var/www/vhosts/pholy.de/pholy-runtime/current/source/pholy-source.tar.gz;
    default_type application/gzip;
    add_header Content-Disposition 'attachment; filename="pholy-source.tar.gz"' always;
    add_header Cache-Control "no-cache" always;
}
location = /source/pholy-source.tar.gz.sha256 {
    alias /var/www/vhosts/pholy.de/pholy-runtime/current/source/pholy-source.tar.gz.sha256;
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
}
location = /source/LICENSE.txt {
    alias /var/www/vhosts/pholy.de/pholy-runtime/current/source/LICENSE.txt;
    default_type text/plain;
}
location / {
    proxy_pass http://127.0.0.1:2288;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 50G;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
}
