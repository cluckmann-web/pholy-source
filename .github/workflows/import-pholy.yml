name: Import complete PHOLY source

on:
  push:
    branches: [main]
    paths: [.github/pholy-import.json]

permissions:
  contents: write

concurrency:
  group: pholy-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'cluckmann-web/pholy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed bootstrap commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify and import the complete source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/import-pholy.py run .github/pholy-import.json
