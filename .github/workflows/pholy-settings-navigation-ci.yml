name: PHOLY settings navigation regression

on:
  push:
    branches:
      - fix/pholy-settings-navigation

permissions:
  contents: read

jobs:
  navigation-widget-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out isolated fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Flutter 3.47.2
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/pholy-flutter"
          test "$(git -C "$RUNNER_TEMP/pholy-flutter" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$RUNNER_TEMP/pholy-flutter/bin" >> "$GITHUB_PATH"

      - name: Test the real helper with a minimal Flutter harness
        shell: bash
        env:
          CI: 'true'
          FLUTTER_SUPPRESS_ANALYTICS: 'true'
          DART_SUPPRESS_ANALYTICS: 'true'
        run: |
          set -euo pipefail
          flutter create --project-name pholy_navigation_regression --platforms=linux --no-pub "$RUNNER_TEMP/nav-test"
          cp mobile/lib/utils/dialog_navigation.dart "$RUNNER_TEMP/nav-test/lib/dialog_navigation.dart"
          sed 's|package:immich_mobile/utils/dialog_navigation.dart|package:pholy_navigation_regression/dialog_navigation.dart|' \
            mobile/test/pholy/dialog_navigation_test.dart > "$RUNNER_TEMP/nav-test/test/dialog_navigation_test.dart"
          cd "$RUNNER_TEMP/nav-test"
          flutter pub get
          flutter test test/dialog_navigation_test.dart

      - name: Check all three profile menu routes and Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('mobile/lib/widgets/common/app_bar_dialog/app_bar_dialog.dart').read_text()
          for line in (
            'navigateFromProfileMenu(const SettingsRoute())',
            'navigateFromProfileMenu(SettingsSubRoute(section: SettingSection.freeUpSpace))',
            'navigateFromProfileMenu(const AppLogRoute())',
            'dismissDialogAndNavigate(context,',
          ):
            assert line in source, line
          assert '() => context.pushRoute(const SettingsRoute())' not in source
          PY
          # Formatting diagnostics in the generated minimal project only.
          # The monorepo analysis_options imports generated dependencies absent here.
          "$RUNNER_TEMP/pholy-flutter/bin/dart" format --output=none \
            "$RUNNER_TEMP/nav-test/lib/dialog_navigation.dart" "$RUNNER_TEMP/nav-test/test/dialog_navigation_test.dart"
