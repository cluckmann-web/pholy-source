name: PHOLY isolated Android test 3 APK build

on:
  push:
    branches:
      - build/pholy-mobile-3.4.1-test.3

permissions:
  contents: read

jobs:
  unsigned-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      PHOLY_FLUTTER_VERSION: '3.47.2'
      PHOLY_FLUTTER_REVISION: d3b14c876900e553bc736ca19295fc09e3853e8e
      PHOLY_FLUTTER_ENGINE: a804b261645ef8c13eb3d5c44a5c2fb0340c5539
      PHOLY_NODE_VERSION: '24.22.1'
      PHOLY_ANDROID_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare temporary CI setup script for isolated branch
        run: |
          sed -i 's@refs/heads/pholy-mobile-native-test@refs/heads/build/pholy-mobile-3.4.1-test.3@g' mobile/scripts/ci-native-smoke.sh
          grep -q 'refs/heads/build/pholy-mobile-3.4.1-test.3' mobile/scripts/ci-native-smoke.sh

      - name: Install pinned toolchain and Android libraries
        run: bash mobile/scripts/ci-native-smoke.sh setup

      - name: Generate existing PHOLY mobile SDK and native bindings
        run: bash mobile/scripts/ci-native-smoke.sh prepare

      - name: Assemble both ABI-specific APKs without product signing keys
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/pholy-native-ci"
          export JAVA_HOME="$tool_dir/jdk21"
          export GRADLE_USER_HOME="$tool_dir/gradle"
          export PUB_CACHE="$tool_dir/pub-cache"
          export CARGO_HOME="$tool_dir/cargo"
          export RUSTUP_HOME="$tool_dir/rustup"
          export RUSTUP_TOOLCHAIN=1.99.1
          export PHOLY_ANDROID_TEST_BUILD=true
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$tool_dir/flutter/bin:$tool_dir/node/bin:$tool_dir/openapi-cli/node_modules/.bin:$JAVA_HOME/bin:$CARGO_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export CC=clang-16 CXX=clang++-16
          cd mobile
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --dart-define=PHOLY_SERVER_URL=https://pholy.de \
            --dart-define=PHOLY_ENABLE_PASSKEYS=false \
            --build-name=3.4.1-pholy-mobile.3 --build-number=3040203
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          sha256sum build/app/outputs/flutter-apk/app-*release.apk

      - name: Preserve intermediate APKs for external existing-key signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pholy-test3-intermediate-apks-${{ github.run_id }}
          path: mobile/build/app/outputs/flutter-apk/app-*release.apk
          retention-days: 3
          compression-level: 0
